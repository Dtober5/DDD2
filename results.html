<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Your Selections — Demon Detailing</title>
<meta name="description" content="Review your selections and email them to Damien." />

<style>
  /* reuse the same red foam background */
  :root{
    --foam-red: #300c12;
    --foam-pink: rgba(255,110,130,.12);
    --foam-bright: rgba(255,200,210,.08);
    --panel: rgba(0,0,0,.28);
    --border: rgba(255,255,255,.12);
    --text: #e8eef7;
    --muted:#b6c3d6;
  }
  html,body{height:100%}
  body{margin:0;background:var(--foam-red);color:var(--text);font:16px/1.45 system-ui,-apple-system,Segoe UI,Inter,Roboto,Arial,sans-serif;overflow-x:hidden;position:relative}
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;opacity:.55;
    background:
      radial-gradient(18px 18px at 20% 15%, var(--foam-bright) 0 45%, transparent 46% 100%),
      radial-gradient(14px 14px at 75% 22%, var(--foam-pink)   0 45%, transparent 46% 100%),
      radial-gradient(20px 20px at 40% 40%, var(--foam-bright) 0 45%, transparent 46% 100%),
      radial-gradient(12px 12px at 60% 70%, var(--foam-pink)   0 45%, transparent 46% 100%),
      radial-gradient(22px 22px at 10% 85%, var(--foam-bright) 0 45%, transparent 46% 100%),
      radial-gradient(16px 16px at 88% 60%, var(--foam-pink)   0 45%, transparent 46% 100%),
      radial-gradient(20px 20px at 55% 10%, var(--foam-bright) 0 45%, transparent 46% 100%),
      radial-gradient(14px 14px at 30% 80%, var(--foam-pink)   0 45%, transparent 46% 100%),
      radial-gradient(18px 18px at 90% 90%, var(--foam-bright) 0 45%, transparent 46% 100%);
    background-blend-mode: screen;
    will-change: transform;
    animation: trickle 240s linear infinite;
  }
  @keyframes trickle { from{ transform: translateY(-2%);} to{ transform: translateY(2%);} }

  .wrap{ max-width: 760px; margin: 0 auto; padding: 28px 16px 80px; }
  header{ background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:14px 16px; }
  h1{ margin:0; font-size:20px }
  .card{ background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:16px; margin-top:16px; }
  ul{ padding-left:18px; }
  .actions{ display:flex; gap:10px; justify-content:flex-end; margin-top:12px; }
  .btn{ appearance:none; border:1px solid var(--border); background:#0b1528; color:var(--text); padding:10px 14px; border-radius:10px; cursor:pointer; text-decoration:none; }
  .btn.ghost{ background:transparent }
  .btn:active{ transform:translateY(1px) }
  footer{ margin-top:16px; color:var(--muted); font-size:13px; text-align:center }
</style>
</head>
<body>
  <div class="wrap">
    <header><h1>Your Selections</h1></header>

    <main class="card">
      <p>Here’s what you chose. If it looks good, click <em>Send To Damien</em> and it will open an email with your list pre-filled.</p>
      <ul id="chosen-list"><li>(Loading…)</li></ul>

      <div class="actions">
        <a href="index.html" class="btn ghost">Back</a>
        <button id="send-email" class="btn">Send To Damien</button>
      </div>
    </main>

    <footer>© <span id="y"></span> Demon Detailing — San Antonio</footer>
  </div>

<script>
  document.getElementById('y').textContent = new Date().getFullYear();

  const list = document.getElementById('chosen-list');
  const picks = JSON.parse(localStorage.getItem('selectedServices')||'[]');
  if(!picks.length){ list.innerHTML = '<li>(No selections found — go back and pick at least one.)</li>'; }
  else{ list.innerHTML = picks.map(p => `<li>${p}</li>`).join(''); }

  document.getElementById('send-email').addEventListener('click', () => {
    const subject = encodeURIComponent('Detailing Request — Selected Services');
    const body = encodeURIComponent('Selected Services:\n' + picks.map(p=>'- '+p).join('\n'));
    location.href = `mailto:damientober@gmail.com?subject=${subject}&body=${body}`;
  });
</script>
</body>
</html>
